  <style>
      /* The printed logo, full-bleed and fixed: the page sits on a photograph of the product
         itself. `fixed` keeps it still while results scroll, so it reads as ground rather
         than as a very tall image. */
      body {
        background: #14100e url('/logo-bg.jpg') center center / cover no-repeat fixed;
        min-height: 100vh;
      }
      /* Scrim. The photo's mean luminance is 81/255 but its highlights (the raised lettering)
         run far brighter, and text has to clear those too. This pins the whole range down so
         stone-100 stays legible everywhere, without flattening the layer lines out of it. */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, rgba(20,16,14,0.62) 0%, rgba(20,16,14,0.55) 45%, rgba(20,16,14,0.72) 100%);
        pointer-events: none;
        z-index: 0;
      }
      #root { position: relative; z-index: 1; }
      ::selection { background: #fcd34d; color: #1c1917; }
  </style>
  <body class="text-stone-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
